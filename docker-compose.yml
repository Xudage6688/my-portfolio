services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - portfolio
      - wedding
    restart: unless-stopped

  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
    expose:
      - "3000"
    restart: unless-stopped

  wedding-mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${WEDDING_MYSQL_ROOT_PASSWORD:-wedding_root_password}
      MYSQL_DATABASE: wedding
    volumes:
      - wedding_mysql_data:/var/lib/mysql
      - ../wedding-invitation/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${WEDDING_MYSQL_ROOT_PASSWORD:-wedding_root_password}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  wedding:
    build:
      context: ../wedding-invitation
      dockerfile: Dockerfile
      args:
        VITE_BASE: /wedding/
    expose:
      - "3000"
    environment:
      PORT: "3000"
      NODE_ENV: production
      MYSQL_HOST: wedding-mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${WEDDING_MYSQL_ROOT_PASSWORD:-wedding_root_password}
      MYSQL_DATABASE: wedding
      ADMIN_USERNAME: "${WEDDING_ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${WEDDING_ADMIN_PASSWORD:-changeme}"
      SESSION_SECRET: "${WEDDING_SESSION_SECRET:-wedding_secret_change_me}"
    depends_on:
      wedding-mysql:
        condition: service_healthy
    volumes:
      - wedding_upload_data:/app/public/uploads
    restart: unless-stopped

  # Phase 3: mdict
  # dict:
  #   build:
  #     context: ../mdict/mydict
  #   expose:
  #     - "3000"

volumes:
  wedding_mysql_data:
  wedding_upload_data:
