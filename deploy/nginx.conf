server {
    listen 80;
    server_name xudage.fun www.xudage.fun;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name xudage.fun www.xudage.fun;

    ssl_certificate /etc/nginx/ssl/xudage.fun_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/xudage.fun.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 10M;

    # Portfolio portal
    location / {
        proxy_pass http://portfolio:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /wedding {
        return 301 /wedding/;
    }

    location /wedding/ {
        proxy_pass http://wedding:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 婚礼站静态资源（前端代码使用绝对路径，需代理到 wedding 服务）
    location /photos/ {
        proxy_pass http://wedding:9000/photos/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /audios/ {
        proxy_pass http://wedding:9000/audios/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # /dict/ 由 portfolio (Next.js) 内置预览页提供，无需单独容器
}
